asyncapi: 3.0.0
info:
  title: RTSP to WebSocket Converter
  version: 1.0.0
  description: >
    RTSP 비디오를 WebSocket으로 변환하는 서비스를 위한 AsyncAPI 문서입니다.
    이 문서는 Async API 를 이용하여 작성되었습니다.
servers:
  production:
    host: localhost:3001
    protocol: ws
    description: RTSP 비디오 스트리밍을 전달받아 WebSocket으로 변환하는 서버입니다.
channels:
  streamRequest:
    address: /
    messages:
      streamRequestMessage:
        summary: 클라이언트가 웹소켓 서버로 RTSP 스트리밍을 요청합니다.
        payload:
          type: object
          required:
            - 스트리밍 옵션
          properties:
            options:
              type: string
              description: 화질
              example: "480p"
  streamResponse:
    address: /
    messages:
      streamData:
        summary: 스트리밍 응답을 클라이언트에게 전달합니다.
        payload:
          type: string
          format: binary
          description: Binary data representing a chunk of video stream

operations:
  requestStream:
    action: send
    channel:
      $ref: "#/channels/streamRequest"
    messages:
      - $ref: "#/channels/streamRequest/messages/streamRequestMessage"
  receiveStream:
    action: receive
    channel:
      $ref: "#/channels/streamResponse"
    messages:
      - $ref: "#/channels/streamResponse/messages/streamData"
