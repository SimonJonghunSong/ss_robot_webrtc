<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>RTSP 스트림 뷰어 with WebSocket and MSE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }

    #video-container {
      display: inline-block;
      position: relative;
    }

    video {
      width: 640px;
      height: 480px;
      border: 2px solid #333;
      background-color: #000;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>RTSP converting to WebSocket</h1>
  <div id="video-container">
    <video id="video" controls autoplay></video>
  </div>
  <div id="status">연결 상태: 연결 중...</div>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');

    if (!('MediaSource' in window)) {
      alert('MediaSource API가 지원되지 않는 브라우저입니다.');
    }

    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);

    mediaSource.addEventListener('sourceopen', () => {
      console.log('MediaSource 열림');
      statusEl.textContent = '연결 상태: MediaSource 열림';

      const mime = 'video/mp4; codecs="avc1.64001E"'; // H.264 High 프로필 Level 3.0
      if (MediaSource.isTypeSupported(mime)) {
        const sourceBuffer = mediaSource.addSourceBuffer(mime);
        sourceBuffer.mode = 'segments'; // 'segments' 모드로 설정

        const ws = new WebSocket('ws://localhost:3001'); // WebSocket 서버 주소
        ws.binaryType = 'arraybuffer'; // 바이너리 데이터 형식 설정

        ws.onopen = () => {
          console.log('WebSocket에 연결됨');
          statusEl.textContent = '연결 상태: 연결됨';
        };

        // 버퍼 큐
        const queue = [];
        let isAppending = false;

        ws.onmessage = (event) => {
          console.log('Received data:', event.data);
          console.log('typeof data:', typeof event.data);
          console.log('data.constructor:', event.data.constructor ? event.data.constructor.name : 'unknown');

          if (event.data instanceof ArrayBuffer) {
            console.log(`수신된 데이터 크기: ${event.data.byteLength} 바이트`);
            const chunk = new Uint8Array(event.data);
            queue.push(chunk);
            appendNext();
          } else if (event.data instanceof Uint8Array) {
            console.log(`수신된 데이터 크기: ${event.data.byteLength} 바이트`);
            queue.push(event.data);
            appendNext();
          } else {
            console.error("받은 데이터 형식이 유효하지 않습니다.");
          }
        };

        ws.onclose = () => {
          console.log('WebSocket 연결 종료');
          statusEl.textContent = '연결 상태: 연결 종료';
          mediaSource.endOfStream();
        };

        ws.onerror = (error) => {
          console.error('WebSocket 오류:', error);
          statusEl.textContent = '연결 상태: 오류 발생';
        };

        function appendNext() {
          if (isAppending || queue.length === 0 || sourceBuffer.updating) {
            return;
          }

          const chunk = queue.shift();
          isAppending = true;
          try {
            sourceBuffer.appendBuffer(chunk);
          } catch (e) {
            console.error('appendBuffer 오류:', e);
          }
        }

        sourceBuffer.addEventListener('updateend', () => {
          isAppending = false;
          appendNext();
        });

        sourceBuffer.addEventListener('error', (e) => {
          console.error('SourceBuffer 오류:', e);
          statusEl.textContent = '오류: SourceBuffer 문제 발생';
        });

      } else {
        console.error(`지원되지 않는 MIME 타입: ${mime}`);
        statusEl.textContent = '오류: 지원되지 않는 MIME 타입';
      }
    });

    mediaSource.addEventListener('error', (e) => {
      console.error('MediaSource 오류:', e);
      statusEl.textContent = '오류: MediaSource 문제 발생';
    });
  </script>
</body>

</html>
