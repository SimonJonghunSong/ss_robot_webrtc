<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>RTSP 스트림 뷰어 with WebSocket and MSE</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }

    #video-container {
      display: inline-block;
      position: relative;
    }

    video {
      width: 640px;
      height: 480px;
      border: 2px solid #333;
      background-color: #000;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>RTSP converting to WebSocket</h1>
  <div id="video-container">
    <video id="video" controls autoplay></video>
    <button id="startRecordBtn" onclick="startRecording()">녹화 시작</button>
    <button id="stopRecordBtn" onclick="stopRecording()" disabled>녹화 종료</button>
  </div>
  <div id="status">연결 상태: 연결 중...</div>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startRecordBtn');
    const stopBtn = document.getElementById('stopRecordBtn');
    let ws;

    if (!('MediaSource' in window)) {
      alert('MediaSource API가 지원되지 않는 브라우저입니다.');
    }

    const mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);

    mediaSource.addEventListener('sourceopen', () => {
      console.log('MediaSource 열림');
      statusEl.textContent = '연결 상태: MediaSource 열림';

      const mime = 'video/mp4; codecs="avc1.64001E"';
      if (MediaSource.isTypeSupported(mime)) {
        const sourceBuffer = mediaSource.addSourceBuffer(mime);
        sourceBuffer.mode = 'segments';

        ws = new WebSocket('ws://localhost:3001');
        ws.binaryType = 'arraybuffer';

        const queue = [];
        let isAppending = false;

        ws.onopen = () => {
          console.log('WebSocket에 연결됨');
          statusEl.textContent = '연결 상태: 연결됨';
          startBtn.disabled = false;
        };

        ws.onmessage = (event) => {
          if (typeof event.data === 'string') {
            try {
              const response = JSON.parse(event.data);
              if (response.type === 'recordingStarted') {
                console.log('녹화가 시작되었습니다.');
              } else if (response.type === 'recordingStopped') {
                console.log('녹화가 종료되었습니다.');
              }
            } catch (e) {
              console.error('JSON 파싱 에러:', e);
            }
          } else if (event.data instanceof ArrayBuffer) {
            const chunk = new Uint8Array(event.data);
            queue.push(chunk);
            appendNext();
          }
        };

        function appendNext() {
          if (isAppending || queue.length === 0 || sourceBuffer.updating) {
            return;
          }

          const chunk = queue.shift();
          isAppending = true;
          try {
            sourceBuffer.appendBuffer(chunk);
          } catch (e) {
            console.error('appendBuffer 오류:', e);
          }
        }

        sourceBuffer.addEventListener('updateend', () => {
          isAppending = false;
          appendNext();
        });

        ws.onclose = () => {
          console.log('WebSocket 연결 종료');
          statusEl.textContent = '연결 상태: 연결 종료';
          mediaSource.endOfStream();
          startBtn.disabled = true;
          stopBtn.disabled = true;
        };

        ws.onerror = (error) => {
          console.error('WebSocket 오류:', error);
          statusEl.textContent = '연결 상태: 오류 발생';
        };
      }
    });

    function startRecording() {
      ws.send(JSON.stringify({ type: "startRecording" }));
      startBtn.disabled = true;
      stopBtn.disabled = false;
      startBtn.classList.add('recording');
      statusEl.textContent = '연결 상태: 녹화 중...';
    }

    function stopRecording() {
      ws.send(JSON.stringify({ type: "stopRecording" }));
      startBtn.disabled = false;
      stopBtn.disabled = true;
      startBtn.classList.remove('recording');
      statusEl.textContent = '연결 상태: 연결됨';
    }

    mediaSource.addEventListener('error', (e) => {
      console.error('MediaSource 오류:', e);
      statusEl.textContent = '오류: MediaSource 문제 발생';
    });
  </script>
</body>

</html>
